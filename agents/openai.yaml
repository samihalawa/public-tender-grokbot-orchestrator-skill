interface:
  display_name: "Public Tender Grokbot Orchestrator"
  short_description: "Autonomous public procurement management, bidding, and post-submission monitoring using grokbot CLI agents"
  default_prompt: "Use $public-tender-grokbot-orchestrator-skill to manage, bid, monitor, and resolve public procurement tenders across Spanish and European platforms (PSCP, PLACSP, DEHú, e-NOTUM, PLYCA, Vortal, SiREC, Regional, Municipal). The skill mandates using the native grokbot CLI (grokbot agent roster, prompt, tail, call, ask, pool, serve) with zero Python relay scripts. Always enforce the Ground-Truth Axiom: an initial submission receipt is never proof that a case is closed; authenticated platform inboxes (DEHú, e-NOTUM, PLACSP Mis Comunicaciones) are the ultimate source of truth. Scrapers must never filter solely by top-level status 'Evaluación'; they must inspect the 'Documentos' tab for Actas and award proposals. Enforce anti-false-expired rules (prohibiting closing cases without official exclusion proof), pre-award Article 150.2 LCSP protocol with Anexo V price retention, supplementary rectification rights, sole-trader eligibility gates (100% remote services, turnover within 1.5x of verified billing), Regla 17 pricing rules (76%-91% of PBL, >=45 €/h), FNMT PAdES/CAdES QES digital signatures, and 3-hour recurring mailbox sweeps across all 7 platform families."
